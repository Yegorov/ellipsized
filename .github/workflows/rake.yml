---
name: rake
'on':
  push:
    branches:
      - master
      - test-action
  pull_request:
    branches:
      - master
jobs:
  rake:
    strategy:
      fail-fast: false
      matrix:
        os:
          # - macos-14
          # - macos-15
          - macos-15-intel
          # - ubuntu-22.04
          # - ubuntu-24.04
          # - windows-2022
          # - windows-2025
        ruby:
          # - 3.2
          # - 3.3
          - 3.4
    name: Rake on ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: printenv
      - uses: docker/setup-docker-action@v4
        if: matrix.os == 'macos-15-intel'
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
